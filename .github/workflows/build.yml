name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Sveglia-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleRelease --no-daemon
        working-directory: SvegliaAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: Sveglia-apk
          path: SvegliaAndroid/app/build/outputs/apk/release/*.apk
